<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>CHARLIE'S 7TH BDAY</title>

  <meta property="og:title" content="CHARLIE'S 7TH BDAY" />
  <meta
    property="og:description"
    content="You're invited to Charlie's 7th Birthday! Tap to RSVP."
  />
  <meta property="og:image" content="https://i.imgur.com/nbBLGks.png" />
  <meta property="og:type" content="website" />

  <!-- Load the important images early -->
  <link
    rel="preload"
    as="image"
    href="https://i.imgur.com/XF0hZiS.png"
  />

  <link
    rel="preload"
    as="image"
    href="https://i.imgur.com/tLVLZo7.png"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: #f0f2f7;
    }

    body {
      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      -webkit-text-size-adjust: 100%;
    }


    /* =====================================================
       INTRO VIDEO
       ===================================================== */

    #intro {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 9999999;

      background: #f0f2f7;

      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    #intro.hide {
      opacity: 0;
      visibility: hidden;

      pointer-events: none;
    }

    #introVideo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;

      border: 0;

      background: #f0f2f7;
    }


    /* =====================================================
       MAIN INVITATION
       ===================================================== */

    .scene {
      position: relative;

      perspective: 1400px;

      text-align: center;

      opacity: 0;

      transform: scale(0.98);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    .scene.ready {
      opacity: 1;

      transform: scale(1);
    }


    /* =====================================================
       ENVELOPE
       ===================================================== */

    .envelope {
      position: relative;

      width: min(320px, 84vw);

      aspect-ratio: 320 / 230;

      transform-style: preserve-3d;

      transition:
        transform 0.8s ease;
    }

    .face {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      border-radius: 6px;

      box-shadow:
        0 6px 15px rgba(0, 0, 0, 0.2);
    }


    /* =====================================================
       FRONT
       ===================================================== */

    .front {
      background:
        linear-gradient(
          #ffffff,
          #f3f4f6
        );

      padding: 18px;
    }

    .invite-title {
      display: block;

      width: 78%;
      max-width: 245px;

      height: auto;

      object-fit: contain;

      pointer-events: none;

      user-select: none;

      -webkit-user-drag: none;
    }


    /* =====================================================
       BACK
       ===================================================== */

    .back {
      transform:
        rotateY(180deg);

      background:
        linear-gradient(
          #ffffff,
          #f3f4f6
        );

      overflow: visible;
    }


    /* =====================================================
       FLAP
       ===================================================== */

    .flap {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 45%;

      background:
        linear-gradient(
          #ffffff,
          #e6e7eb
        );

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin:
        top center;

      transition:
        transform 0.8s ease;

      z-index: 2;

      box-shadow:
        inset 0 -3px 5px rgba(0, 0, 0, 0.15),
        0 3px 6px rgba(0, 0, 0, 0.2);
    }


    /* =====================================================
       POCKET
       ===================================================== */

    .pocket {
      position: absolute;

      bottom: 0;
      left: 0;

      width: 100%;
      height: 55%;

      background: #f8f9fb;
    }


    /* =====================================================
       INVITATION CARD
       ===================================================== */

    .card {
      position: absolute;

      width: min(280px, 74vw);

      aspect-ratio: 280 / 400;

      background: white;

      left: 50%;
      top: 90%;

      transform:
        translate(-50%, 0);

      opacity: 0;

      transition:
        transform 0.9s ease,
        opacity 0.35s ease;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.18);

      z-index: 3;
    }

    .card img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =====================================================
       ENVELOPE ANIMATION
       ===================================================== */

    .scene.spin .envelope {
      transform:
        rotateY(180deg);
    }

    .scene.open .flap {
      transform:
        rotateX(-160deg);
    }

    .scene.slide .card {
      opacity: 1;

      transform:
        translate(-50%, -120%);
    }


    /* =====================================================
       RSVP
       ===================================================== */

    .rsvp-hint {
      margin:
        12px 0 6px;

      font-size: 1.05rem;
      font-weight: bold;

      color: #444;

      opacity: 0;

      transition:
        opacity 0.35s ease;
    }

    .buttons {
      margin-top: 8px;

      display: none;

      gap: 10px;

      justify-content: center;

      flex-wrap: wrap;
    }

    .buttons.show {
      display: flex;
    }

    .buttons button {
      display: flex;

      align-items: center;

      padding:
        10px 15px;

      min-height: 44px;

      font-size: 1rem;

      border: none;

      border-radius: 5px;

      -webkit-tap-highlight-color:
        transparent;
    }

    .attend {
      background: #695791;

      color: white;
    }

    .decline {
      background: #e96485;

      color: white;
    }


    /* =====================================================
       ROCKET CURSOR - DESKTOP ONLY
       ===================================================== */

    #rocketCursor {
      display: none;
    }

    @media (hover: hover) and (pointer: fine) {
      html,
      body,
      body *,
      button {
        cursor: none !important;
      }

      #rocketCursor {
        display: block;

        position: fixed;

        top: 0;
        left: 0;

        width: 65px;
        height: 65px;

        pointer-events: none;

        z-index: 999999;

        transform:
          translate(-50%, -50%);
      }

      #rocketCursor img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: contain;

        pointer-events: none;

        user-select: none;
      }
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      body {
        padding:
          env(safe-area-inset-top)
          12px
          env(safe-area-inset-bottom);
      }

      #introVideo {
        object-fit: cover;
      }

      .scene {
        width: 100%;
      }

      .envelope {
        width: min(300px, 82vw);
      }

      .card {
        width: min(265px, 72vw);
      }

      .invite-title {
        width: 82%;
      }

      .buttons button {
        font-size: 16px;
      }
    }


    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-width: 360px) {

      .envelope {
        width: 270px;
      }

      .card {
        width: 240px;
      }
    }
  </style>
</head>


<body>

  <!-- =====================================================
       INTRO
       ===================================================== -->

  <div id="intro">

    <video
      id="introVideo"
      muted
      autoplay
      playsinline
      webkit-playsinline
      preload="metadata"
      disablepictureinpicture
    >

      <source
        src="https://i.imgur.com/a2ukz4B.mp4"
        type="video/mp4"
      />

    </video>

  </div>


  <!-- =====================================================
       ROCKET CURSOR
       ===================================================== -->

  <div id="rocketCursor">

    <img
      src="https://i.imgur.com/vkgyQTf.png"
      alt=""
    />

  </div>


  <!-- =====================================================
       INVITATION
       ===================================================== -->

  <div
    class="scene"
    id="scene"
  >

    <div class="envelope">

      <!-- FRONT -->

      <div class="face front">

        <img
          src="https://i.imgur.com/XF0hZiS.png"
          alt="You're Invited"
          class="invite-title"
        />

      </div>


      <!-- BACK -->

      <div class="face back">

        <div class="flap"></div>

        <div class="pocket"></div>

      </div>

    </div>


    <!-- CARD -->

    <div
      class="card"
      id="card"
    >

      <img
        src="https://i.imgur.com/tLVLZo7.png"
        alt="Charlie's 7th Birthday Invitation"
      />

    </div>


    <!-- RSVP -->

    <div
      class="rsvp-hint"
      id="rsvpHint"
    >
      Tap to RSVP
    </div>


    <div
      class="buttons"
      id="buttons"
    >

      <button class="attend">
        Attending
      </button>

      <button class="decline">
        Not Attending
      </button>

    </div>

  </div>


  <script>

    const intro =
      document.getElementById("intro");

    const introVideo =
      document.getElementById("introVideo");

    const scene =
      document.getElementById("scene");

    const buttons =
      document.getElementById("buttons");

    const rsvpHint =
      document.getElementById("rsvpHint");

    const rocketCursor =
      document.getElementById("rocketCursor");


    /* =====================================================
       INTRO
       ===================================================== */

    let introFinished = false;


    function finishIntro() {

      if (introFinished) {
        return;
      }

      introFinished = true;


      scene.classList.add("ready");

      intro.classList.add("hide");


      /*
        Stop video immediately after transition
        so the browser isn't still decoding it.
      */

      setTimeout(() => {

        introVideo.pause();

        intro.remove();

      }, 350);

    }


    /*
      Normal ending
    */

    introVideo.addEventListener(
      "ended",
      finishIntro
    );


    /*
      If video cannot load
    */

    introVideo.addEventListener(
      "error",
      finishIntro
    );


    /*
      Start playback
    */

    window.addEventListener(
      "load",
      () => {

        introVideo.muted = true;


        const playPromise =
          introVideo.play();


        if (
          playPromise !== undefined
        ) {

          playPromise.catch(() => {

            /*
              If autoplay is blocked,
              first tap starts it.
            */

            const startVideo = () => {

              introVideo
                .play()
                .catch(finishIntro);

            };


            document.addEventListener(
              "touchstart",
              startVideo,
              {
                once: true,
                passive: true
              }
            );


            document.addEventListener(
              "click",
              startVideo,
              {
                once: true
              }
            );

          });

        }

      }
    );


    /*
      IMPORTANT MOBILE FALLBACK

      If the video is loading too slowly,
      don't make someone stare at a blank
      screen forever.

      After 6 seconds, reveal invitation.
    */

    setTimeout(() => {

      if (!introFinished) {

        finishIntro();

      }

    }, 6000);


    /* =====================================================
       ROCKET CURSOR
       ===================================================== */

    if (
      window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      ).matches
    ) {

      document.addEventListener(
        "mousemove",
        (e) => {

          rocketCursor.style.left =
            e.clientX + "px";

          rocketCursor.style.top =
            e.clientY + "px";

        }
      );

    }


    /* =====================================================
       OPEN ENVELOPE
       ===================================================== */

    scene.addEventListener(
      "click",
      () => {

        if (!introFinished) {
          return;
        }


        if (
          scene.classList.contains("spin")
        ) {
          return;
        }


        scene.classList.add("spin");


        setTimeout(() => {

          scene.classList.add("open");

        }, 800);


        setTimeout(() => {

          scene.classList.add("slide");

          buttons.classList.add("show");

          rsvpHint.style.opacity = "1";

        }, 1600);

      }
    );


    /* =====================================================
       RSVP
       ===================================================== */

    (function () {

      const phone =
        "+16166489671";


      const ua =
        navigator.userAgent || "";


      const isIOS =
        /iPad|iPhone|iPod/.test(ua);


      window.sendRSVP =
        function (status) {

          const body =
            `RSVP: ${status} Charlie's 7th Birthday Party.`;


          const encoded =
            encodeURIComponent(body);


          const link =
            isIOS
              ? `sms:${phone}&body=${encoded}`
              : `sms:${phone}?body=${encoded}`;


          try {

            window.location.href =
              link;

          }

          catch (err) {

            alert(
              `Please text ${phone} with: ${body}`
            );

          }

        };


      document
        .querySelector(".attend")
        .addEventListener(
          "click",
          (e) => {

            e.stopPropagation();

            sendRSVP("Attending");

          }
        );


      document
        .querySelector(".decline")
        .addEventListener(
          "click",
          (e) => {

            e.stopPropagation();

            sendRSVP("Not Attending");

          }
        );

    })();

  </script>

</body>
</html>
