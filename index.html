<!DOCTYPE html>
<title>&#8203;</title>

<meta property="og:title" content="&#8203;" />

<meta
property="og:description"
content="You're invited to Charlie's 7th Birthday! Tap to RSVP."
/>

<meta
property="og:image"
content="https://i.imgur.com/nbBLGks.png"
/>

<meta property="og:type" content="website" />

<style>

/* =====================================================
   GLOBAL
   ===================================================== */

* {
box-sizing: border-box;
}

html,
body {
width: 100%;
height: 100%;
margin: 0;
padding: 0;
}

html {
overflow: hidden;
}

body {
position: relative;

width: 100vw;
height: 100vh;
height: 100dvh;

overflow: hidden;

background: #f0f2f7;

font-family:
Arial,
Helvetica,
sans-serif;

-webkit-text-size-adjust: 100%;
}


/* =====================================================
   MASTER FIT STAGE
   ===================================================== */

#fitStage {
position: fixed;

left: 50%;
top: 50%;

width: 320px;
height: 500px;

transform-origin: center center;

transform:
translate(-50%, -50%)
scale(var(--fit-scale, 1));

will-change:
left,
top,
transform;

z-index: 1;
}


/* =====================================================
   MAIN SCENE
   ===================================================== */

.scene {
position: absolute;

left: 0;
top: 0;

width: 320px;

perspective: 1400px;

text-align: center;

opacity: 0;

transform: scale(0.98);
transform-origin: center center;

transition:
opacity 0.6s ease,
transform 0.6s ease;
}

.scene.ready {
opacity: 1;

transform: scale(1);
}


/* =====================================================
   ENVELOPE
   ===================================================== */

.envelope {
width: 320px;
height: 230px;

position: relative;

transform-style: preserve-3d;

transition:
transform 0.8s ease;

-webkit-tap-highlight-color: transparent;

touch-action: manipulation;
}

.face {
position: absolute;

width: 100%;
height: 100%;

display: flex;

align-items: center;
justify-content: center;

backface-visibility: hidden;
-webkit-backface-visibility: hidden;

border-radius: 6px;

box-shadow:
0 6px 15px rgba(0, 0, 0, 0.2);
}


/* =====================================================
   FRONT OF ENVELOPE
   ===================================================== */

.front {
background:
linear-gradient(
#ffffff,
#f3f4f6
);

display: flex;

align-items: center;
justify-content: center;

padding: 18px;
}

.invite-title {
display: block;

width: 78%;
max-width: 245px;
height: auto;

object-fit: contain;

pointer-events: none;

user-select: none;

-webkit-user-drag: none;
}


/* =====================================================
   BACK OF ENVELOPE
   ===================================================== */

.back {
transform:
rotateY(180deg);

background:
linear-gradient(
#ffffff,
#f3f4f6
);

overflow: visible;
}


/* =====================================================
   ENVELOPE FLAP
   ===================================================== */

.flap {
position: absolute;

top: 0;
left: 0;

width: 100%;
height: 45%;

background:
linear-gradient(
#ffffff,
#e6e7eb
);

clip-path:
polygon(
0 0,
100% 0,
50% 100%
);

transform-origin:
top center;

transition:
transform 0.8s ease;

z-index: 2;

box-shadow:
inset 0 -3px 5px rgba(0, 0, 0, 0.15),
0 3px 6px rgba(0, 0, 0, 0.2);
}


/* =====================================================
   ENVELOPE POCKET
   ===================================================== */

.pocket {
position: absolute;

bottom: 0;
left: 0;

width: 100%;
height: 55%;

background:
#f8f9fb;
}


/* =====================================================
   INVITATION CARD
   ===================================================== */

.card {
position: absolute;

width: 280px;
height: 400px;

background: white;

left: 50%;
top: 90%;

transform:
translate(-50%, 0);

opacity: 0;

transition:
transform 0.9s ease,
opacity 0.4s ease;

box-shadow:
0 8px 20px rgba(0, 0, 0, 0.18);

z-index: 3;

pointer-events: none;
}

.card img {
display: block;

width: 100%;
height: 100%;

object-fit: contain;

user-select: none;

-webkit-user-drag: none;
}


/* =====================================================
   ENVELOPE ANIMATION
   ===================================================== */

.scene.spin .envelope {
transform:
rotateY(180deg);
}

.scene.open .flap {
transform:
rotateX(-160deg);
}

.scene.slide .card {
opacity: 1;

transform:
translate(-50%, -120%);
}


/* =====================================================
   RSVP HINT
   ===================================================== */

.rsvp-hint {
position: relative;

font-size: 1.05em;
font-weight: bold;

color: #444;

margin:
12px 0 6px;

opacity: 0;

transition:
opacity 0.4s ease;

pointer-events: none;
}


/* =====================================================
   RSVP BUTTONS
   ===================================================== */

.buttons {
position: relative;

margin-top: 8px;

display: none;

gap: 10px;

justify-content: center;

flex-wrap: wrap;

z-index: 50;
}

.buttons.show {
display: flex;
}

.buttons button {
position: relative;

display: flex;

align-items: center;
justify-content: center;

gap: 6px;

padding:
10px 15px;

font-size: 1em;

border: none;

border-radius: 5px;

transition:
box-shadow 0.3s ease,
transform 0.2s ease;

-webkit-tap-highlight-color: transparent;

touch-action: manipulation;

cursor: pointer;

z-index: 51;
}

.attend {
background-color:
#695791;

color: white;
}

.decline {
background-color:
#e96485;

color: white;
}


/* =====================================================
   BUTTON HOVER
   ===================================================== */

@media
(hover: hover)
and
(pointer: fine) {

.buttons button:hover {
box-shadow:
0 0 15px rgba(255, 215, 0, 0.7);

transform:
scale(1.05);
}

}

.buttons button:active {
transform:
scale(0.97);

box-shadow:
0 0 12px rgba(255, 215, 0, 0.6);
}


/* =====================================================
   DESKTOP ROCKET CURSOR
   ===================================================== */

#rocketCursor {
display: none;
}

@media
(hover: hover)
and
(pointer: fine) {

html,
body,
body *,
button {
cursor: none !important;
}

#rocketCursor {
display: block;

position: fixed;

top: 0;
left: 0;

width: 65px;
height: 65px;

pointer-events: none;

z-index: 999999;

transform:
translate(-50%, -50%);

will-change:
left,
top;
}

#rocketCursor img {
display: block;

width: 100%;
height: 100%;

object-fit: contain;

pointer-events: none;

user-select: none;

-webkit-user-drag: none;
}

}


/* =====================================================
   HIDE DESKTOP CURSOR ON TOUCH DEVICES
   ===================================================== */

@media
(hover: none),
(pointer: coarse) {

#rocketCursor {
display: none !important;
}

}


/* =====================================================
   MOBILE TOUCH ROCKET
   ===================================================== */

#touchRocket {
display: none;

position: fixed;

top: 0;
left: 0;

width: 58px;
height: 58px;

pointer-events: none;

z-index: 9999999;

opacity: 0;

transform:
translate(-50%, -50%);

will-change:
left,
top,
transform,
opacity;
}

#touchRocket img {
display: block;

width: 100%;
height: 100%;

object-fit: contain;

pointer-events: none;

user-select: none;

-webkit-user-drag: none;
}


@media
(hover: none),
(pointer: coarse) {

#touchRocket {
display: block;
}

#touchRocket.touching {
opacity: 1;

transform:
translate(-50%, -50%)
scale(1);
}

#touchRocket.launch {
animation:
touchRocketLaunch
0.38s
ease-out
forwards;
}

}


/* =====================================================
   MOBILE ROCKET LAUNCH
   ===================================================== */

@keyframes touchRocketLaunch {

0% {
opacity: 1;

transform:
translate(-50%, -50%)
scale(1);
}

35% {
opacity: 1;

transform:
translate(-50%, -70%)
scale(1.12);
}

100% {
opacity: 0;

transform:
translate(-50%, -125%)
scale(0.88);
}

}


/* =====================================================
   MOBILE BASE DIMENSIONS
   ===================================================== */

@media (max-width: 500px) {

.scene {
width: 300px;
}

.envelope {
width: 300px;
height: 216px;
}

.card {
width: 265px;
height: 379px;
}

.invite-title {
width: 80%;
max-width: 225px;
}

}


/* =====================================================
   VERY SMALL PHONES
   ===================================================== */

@media (max-width: 350px) {

.scene {
width: 285px;
}

.envelope {
width: 285px;
height: 205px;
}

.card {
width: 250px;
height: 357px;
}

.buttons button {
padding:
9px 12px;

font-size:
0.95em;
}

}

</style>

</head>


<body>


<!-- =====================================================
     DESKTOP ROCKET CURSOR
     ===================================================== -->

<div id="rocketCursor">

<img
src="https://i.imgur.com/vkgyQTf.png"
alt=""
/>

</div>


<!-- =====================================================
     MOBILE TOUCH ROCKET
     ===================================================== -->

<div id="touchRocket">

<img
src="https://i.imgur.com/vkgyQTf.png"
alt=""
/>

</div>


<!-- =====================================================
     MASTER SCALING STAGE
     ===================================================== -->

<div id="fitStage">


<!-- =====================================================
     INVITATION
     ===================================================== -->

<div
class="scene"
id="scene"
>


<!-- =====================================================
     ENVELOPE
     ===================================================== -->

<div
class="envelope"
id="envelope"
>


<!-- FRONT -->

<div class="face front">

<img
src="https://i.imgur.com/XF0hZiS.png"
alt="You're Invited"
class="invite-title"
/>

</div>


<!-- BACK -->

<div class="face back">

<div class="flap"></div>

<div class="pocket"></div>

</div>


</div>


<!-- =====================================================
     INVITATION CARD
     ===================================================== -->

<div
class="card"
id="card"
>

<img
src="https://i.imgur.com/OjVwPWu.png"
alt="Charlie's 7th Birthday Invitation"
/>

</div>


<!-- =====================================================
     RSVP TEXT
     ===================================================== -->

<div
class="rsvp-hint"
id="rsvpHint"
>

Tap to RSVP

</div>


<!-- =====================================================
     RSVP BUTTONS
     ===================================================== -->

<div
class="buttons"
id="buttons"
>


<button
class="attend"
id="attendButton"
type="button"
>

Attending

</button>


<button
class="decline"
id="declineButton"
type="button"
>

Not Attending

</button>


</div>


</div>

</div>


<script>

/* =====================================================
   ELEMENTS
   ===================================================== */

const fitStage =
document.getElementById(
"fitStage"
);

const scene =
document.getElementById(
"scene"
);

const envelope =
document.getElementById(
"envelope"
);

const buttons =
document.getElementById(
"buttons"
);

const rsvpHint =
document.getElementById(
"rsvpHint"
);

const rocketCursor =
document.getElementById(
"rocketCursor"
);

const touchRocket =
document.getElementById(
"touchRocket"
);

const attendButton =
document.getElementById(
"attendButton"
);

const declineButton =
document.getElementById(
"declineButton"
);


/* =====================================================
   MEASURE COMPLETE INVITATION
   ===================================================== */

function measureSceneState(
openState = false
) {

const clone =
scene.cloneNode(true);


/*
Remove duplicate IDs.
*/

clone.removeAttribute(
"id"
);

clone
.querySelectorAll(
"[id]"
)
.forEach(
(el) => {

el.removeAttribute(
"id"
);

}
);


/*
Remove all animation state.
*/

clone.classList.remove(
"ready",
"spin",
"open",
"slide"
);


/*
Fully open clone when measuring
the completed invitation.
*/

if (openState) {

clone.classList.add(
"spin",
"open",
"slide"
);


const cloneButtons =
clone.querySelector(
".buttons"
);

const cloneHint =
clone.querySelector(
".rsvp-hint"
);


if (cloneButtons) {

cloneButtons.classList.add(
"show"
);

}


if (cloneHint) {

cloneHint.style.opacity =
"1";

}

}


/*
Move measuring version completely
outside the real layout.
*/

clone.style.position =
"fixed";

clone.style.left =
"0";

clone.style.top =
"0";

clone.style.opacity =
"1";

clone.style.visibility =
"hidden";

clone.style.pointerEvents =
"none";

clone.style.transform =
"none";

clone.style.transition =
"none";

clone.style.zIndex =
"-999999";


document.body.appendChild(
clone
);


/*
Scene's own origin.
*/

const baseRect =
clone.getBoundingClientRect();


let minLeft =
Infinity;

let maxRight =
-Infinity;

let minTop =
Infinity;

let maxBottom =
-Infinity;


/*
Include clone itself.
*/

const elements =
[
clone,
...clone.querySelectorAll("*")
];


elements.forEach(
(el) => {

const style =
window.getComputedStyle(
el
);


/*
Ignore things that are actually removed
from layout.
*/

if (
style.display ===
"none"
) {

return;

}


/*
For CLOSED state, do not measure
the hidden invitation card or buttons.
*/

if (
!openState
) {

if (
el !== clone &&
(
el.matches(".card") ||
el.closest(".card") ||
el.matches(".buttons") ||
el.closest(".buttons")
)
) {

return;

}

}


/*
Measure element.
*/

const rect =
el.getBoundingClientRect();


if (
rect.width === 0 &&
rect.height === 0
) {

return;

}


minLeft =
Math.min(
minLeft,
rect.left
);

maxRight =
Math.max(
maxRight,
rect.right
);

minTop =
Math.min(
minTop,
rect.top
);

maxBottom =
Math.max(
maxBottom,
rect.bottom
);

}
);


clone.remove();


return {

left:
minLeft -
baseRect.left,

right:
maxRight -
baseRect.left,

top:
minTop -
baseRect.top,

bottom:
maxBottom -
baseRect.top

};

}


/* =====================================================
   FIT AS LARGE AS POSSIBLE
   ===================================================== */

function fitInvitationToScreen() {

/*
Measure both animation states.
*/

const closed =
measureSceneState(
false
);

const opened =
measureSceneState(
true
);


/*
Create one bounding box that contains
EVERYTHING throughout the animation.
*/

let left =
Math.min(
closed.left,
opened.left
);

let right =
Math.max(
closed.right,
opened.right
);

let top =
Math.min(
closed.top,
opened.top
);

let bottom =
Math.max(
closed.bottom,
opened.bottom
);


/*
Allow room for card and envelope shadows.
*/

const designBuffer =
7;

left -=
designBuffer;

right +=
designBuffer;

top -=
designBuffer;

bottom +=
designBuffer;


const designWidth =
right -
left;

const designHeight =
bottom -
top;


/*
The stage becomes the exact dimensions
of the complete animation footprint.
*/

fitStage.style.width =
designWidth +
"px";

fitStage.style.height =
designHeight +
"px";


/*
Shift the original scene so the
complete footprint begins at 0,0.

This centers the COMPLETE opened design,
not just the original envelope.
*/

scene.style.left =
(-left) +
"px";

scene.style.top =
(-top) +
"px";


/* =====================================================
   ACTUAL VISIBLE VIEWPORT
   ===================================================== */

const viewport =
window.visualViewport;


const viewportWidth =
viewport
?
viewport.width
:
window.innerWidth;


const viewportHeight =
viewport
?
viewport.height
:
window.innerHeight;


const viewportLeft =
viewport
?
viewport.offsetLeft
:
0;


const viewportTop =
viewport
?
viewport.offsetTop
:
0;


/* =====================================================
   SCREEN EDGE PADDING
   ===================================================== */

const mobile =
viewportWidth <=
500;


/*
Only a small margin is necessary.

visualViewport already removes browser
toolbar space on iPhones.
*/

const horizontalPadding =
mobile
?
10
:
18;


const topPadding =
mobile
?
10
:
18;


const bottomPadding =
mobile
?
14
:
18;


/*
Respect iPhone notch / home indicator
when the browser exposes the safe area.
*/

const safeWidth =
Math.max(
1,
viewportWidth -
horizontalPadding * 2
);


const safeHeight =
Math.max(
1,
viewportHeight -
topPadding -
bottomPadding
);


/* =====================================================
   MAXIMUM POSSIBLE SCALE
   ===================================================== */

/*
NO MAXIMUM SIZE CAP.

This lets a laptop enlarge the design.

A phone will automatically shrink it.

Whichever dimension runs out of room first
determines the final scale.
*/

const fitScale =
Math.min(

safeWidth /
designWidth,

safeHeight /
designHeight

);


/*
Tiny safety amount prevents shadows
from touching the edge due to browser
sub-pixel rounding.
*/

const safeScale =
fitScale *
0.985;


fitStage.style.setProperty(
"--fit-scale",
safeScale.toFixed(4)
);


/* =====================================================
   CENTER INSIDE ACTUAL VISIBLE SCREEN
   ===================================================== */

const safeLeft =
viewportLeft +
horizontalPadding;


const safeRight =
viewportLeft +
viewportWidth -
horizontalPadding;


const safeTop =
viewportTop +
topPadding;


const safeBottom =
viewportTop +
viewportHeight -
bottomPadding;


const centerX =
safeLeft +
(
safeRight -
safeLeft
) / 2;


const centerY =
safeTop +
(
safeBottom -
safeTop
) / 2;


fitStage.style.left =
centerX +
"px";


fitStage.style.top =
centerY +
"px";

}


/* =====================================================
   INITIAL FIT
   ===================================================== */

fitInvitationToScreen();


requestAnimationFrame(
() => {

fitInvitationToScreen();

scene.classList.add(
"ready"
);

}
);


/*
Recalculate after images are fully loaded.
*/

window.addEventListener(
"load",
() => {

fitInvitationToScreen();

}
);


/* =====================================================
   RESPONSIVE REFIT
   ===================================================== */

window.addEventListener(
"resize",
() => {

fitInvitationToScreen();

}
);


window.addEventListener(
"orientationchange",
() => {

setTimeout(
() => {

fitInvitationToScreen();

},
150
);

}
);


/*
Very important for iPhone Safari because
the visible viewport changes when the
browser bars expand/collapse.
*/

if (
window.visualViewport
) {

window.visualViewport.addEventListener(
"resize",
() => {

fitInvitationToScreen();

}
);


window.visualViewport.addEventListener(
"scroll",
() => {

fitInvitationToScreen();

}
);

}


/* =====================================================
   DESKTOP ROCKET CURSOR
   ===================================================== */

document.addEventListener(
"mousemove",
(e) => {

rocketCursor.style.left =
e.clientX +
"px";

rocketCursor.style.top =
e.clientY +
"px";

}
);


/* =====================================================
   MOBILE TOUCH ROCKET
   ===================================================== */

function moveTouchRocket(
x,
y
) {

touchRocket.style.left =
x +
"px";

touchRocket.style.top =
y +
"px";

}


function startTouchRocket(
e
) {

if (
e.pointerType !==
"touch"
) {

return;

}


moveTouchRocket(
e.clientX,
e.clientY
);


touchRocket.classList.remove(
"launch"
);


touchRocket.classList.add(
"touching"
);

}


function moveTouchRocketEvent(
e
) {

if (
e.pointerType !==
"touch"
) {

return;

}


moveTouchRocket(
e.clientX,
e.clientY
);

}


function finishTouchRocket(
e
) {

if (
e.pointerType !==
"touch"
) {

return;

}


touchRocket.classList.remove(
"touching"
);


touchRocket.classList.remove(
"launch"
);


void touchRocket.offsetWidth;


touchRocket.classList.add(
"launch"
);


setTimeout(
() => {

touchRocket.classList.remove(
"launch"
);

},
380
);

}


function cancelTouchRocket(
e
) {

if (
e.pointerType !==
"touch"
) {

return;

}


touchRocket.classList.remove(
"touching"
);


touchRocket.classList.remove(
"launch"
);

}


/* =====================================================
   TOUCH LISTENERS
   ===================================================== */

document.addEventListener(
"pointerdown",
startTouchRocket
);


document.addEventListener(
"pointermove",
moveTouchRocketEvent
);


document.addEventListener(
"pointerup",
finishTouchRocket
);


document.addEventListener(
"pointercancel",
cancelTouchRocket
);


/* =====================================================
   OPEN INVITATION
   ===================================================== */

let invitationOpening =
false;


function openInvitation() {

if (
invitationOpening ||
scene.classList.contains(
"spin"
)
) {

return;

}


invitationOpening =
true;


/*
Flip envelope.
*/

scene.classList.add(
"spin"
);


/*
Open flap.
*/

setTimeout(
() => {

scene.classList.add(
"open"
);

},
800
);


/*
Pull invitation card upward.
*/

setTimeout(
() => {

scene.classList.add(
"slide"
);


/*
Reveal RSVP controls.
*/

buttons.classList.add(
"show"
);


rsvpHint.style.opacity =
"1";


/*
Refit once buttons are actually visible.

This makes sure Safari cannot cut them off.
*/

requestAnimationFrame(
() => {

fitInvitationToScreen();

}
);

},
1600
);

}


/* =====================================================
   ENVELOPE INTERACTION
   ===================================================== */

envelope.addEventListener(
"pointerup",
(e) => {

e.preventDefault();

e.stopPropagation();

openInvitation();

}
);


/* =====================================================
   RSVP
   ===================================================== */

const phone =
"+16166489671";


function sendRSVP(
status
) {

const body =
`RSVP: ${status} Charlie's 7th Birthday Party.`;


const encoded =
encodeURIComponent(
body
);


const ua =
navigator.userAgent ||
"";


const isIOS =
/iPad|iPhone|iPod/.test(
ua
);


const link =
isIOS
?
`sms:${phone}&body=${encoded}`
:
`sms:${phone}?body=${encoded}`;


try {

window.location.href =
link;

}

catch (
err
) {

alert(
`Please text ${phone} with: ${body}`
);

}

}


/* =====================================================
   ATTENDING BUTTON
   ===================================================== */

attendButton.addEventListener(
"pointerup",
(e) => {

e.preventDefault();

e.stopPropagation();


sendRSVP(
"Attending"
);

}
);


/* =====================================================
   NOT ATTENDING BUTTON
   ===================================================== */

declineButton.addEventListener(
"pointerup",
(e) => {

e.preventDefault();

e.stopPropagation();


sendRSVP(
"Not Attending"
);

}
);

</script>


</body>

</html>
